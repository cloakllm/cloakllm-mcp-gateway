[project]
name = "cloakllm-mcp-gateway"
version = "0.1.0.dev0"
description = "A CloakLLM sanitizing proxy between an MCP client and other MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "The CloakLLM Authors", email = "cloakllm@gmail.com"}]
keywords = ["llm", "pii", "mcp", "privacy", "compliance", "proxy", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

# The cap moves with the floor. A "<next-minor" cap that stays behind while
# the floor rises blocks its own fix -- this project has been bitten twice,
# most recently by a cryptography cap that blocked the CVE fix for itself.
dependencies = [
    "cloakllm>=0.12.2,<0.13.0",
]

[project.optional-dependencies]
# NER (PERSON / ORG / GPE) is a separate install, matching the SDK's own
# split. It is genuinely a trade-off here rather than a free win: in a proxy
# a false positive tokenizes a value the model needed, so an operator who
# only wants high-confidence regex categories should not be made to carry
# spaCy.
detection = ["cloakllm[detection]>=0.12.2,<0.13.0"]
dev = [
    "pytest>=7.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "cloakllm[detection]>=0.12.2,<0.13.0",
]

[project.scripts]
cloakllm-gateway = "cloakllm_gateway.__main__:main"

[project.urls]
Homepage = "https://github.com/cloakllm/cloakllm-mcp-gateway"
Repository = "https://github.com/cloakllm/cloakllm-mcp-gateway"
Issues = "https://github.com/cloakllm/cloakllm-mcp-gateway/issues"

[tool.setuptools.packages.find]
include = ["cloakllm_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode and rootdir matter here: tests/conftest.py is imported by name
# from the test modules, so the repo root has to be on sys.path.
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
