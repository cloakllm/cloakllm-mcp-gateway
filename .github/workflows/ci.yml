name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The full declared range from the start. The sibling repos learned
        # this the hard way: their matrix stopped at 3.12 while pyproject
        # said >=3.10, so two minors shipped unexercised.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are SHA-pinned, not tag-pinned: a tag is mutable and this is
      # security tooling.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # Both are CI build-time tools with known CVEs on the stock runner.
      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
      - name: Assert the only runtime dependency is cloakllm
        run: |
          # The gateway reuses the SDK rather than reimplementing detection,
          # and that is the whole dependency budget. Anything else appearing
          # here is a vendored-logic smell.
          #
          # Reads the INSTALLED metadata rather than pyproject.toml: tomllib
          # is 3.11+ and this matrix starts at 3.10, and the built metadata
          # is what a user actually resolves anyway.
          python - <<'PY'
          import re, sys
          from importlib.metadata import requires
          runtime = [r for r in (requires("cloakllm-mcp-gateway") or [])
                     if "extra ==" not in r]
          names = sorted(re.split(r"[\s\[<>=!;]", r, 1)[0] for r in runtime)
          if names != ["cloakllm"]:
              sys.exit("::error::unexpected runtime dependencies: %r" % runtime)
          print("confirmed: runtime deps are exactly %r" % runtime)
          PY
      - name: Run tests
        run: pytest tests/ -v
      - name: Static security scan (bandit)
        run: |
          pip install bandit
          bandit -r cloakllm_gateway/ -ll
      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

  # The unit suite drives the gateway against a fake upstream this repo
  # wrote, so it shares the implementation's assumptions. This job runs the
  # same session against a real third-party MCP server and diffs the
  # transcripts -- which is how the -32601-vs-empty-list divergence was
  # found, and a mock could not have found it.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
      - name: Install a real MCP server
        working-directory: tests/acceptance
        run: |
          echo '{"name":"acceptance","version":"1.0.0","private":true}' > package.json
          npm install @modelcontextprotocol/server-filesystem
      - name: Real-server diff, transparent and protecting
        working-directory: tests/acceptance
        run: python real_server.py
